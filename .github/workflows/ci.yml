name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test deployment connection scripts
        run: python3 .github/scripts/test_deploy_wireguard.py

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

  publish_image:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version_tag: ${{ steps.image.outputs.version_tag }}
    if: >
      github.event_name != 'workflow_dispatch' &&
      (github.ref_type == 'tag' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: image
        run: |
          IMAGE="${{ vars.REGISTRY_IMAGE }}"
          if [ -z "${IMAGE}" ]; then
            IMAGE="registry.myhometech.de/semantic-home/frontend"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_TAG="dev-${GITHUB_SHA::7}"
          fi
          {
            echo "image=${IMAGE}"
            echo "version_tag=${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: registry.myhometech.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish_image
    if: >
      github.event_name != 'workflow_dispatch' &&
      (github.ref_type == 'tag' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment:
      name: production
    concurrency:
      group: frontend-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WireGuard tools
        run: |
          if ! command -v wg-quick >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wireguard-tools
          fi

      - name: Connect deployment VPN
        env:
          DEPLOY_WIREGUARD_CONFIG: ${{ secrets.DEPLOY_WIREGUARD_CONFIG }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: bash .github/scripts/deploy-wireguard.sh up frontend

      - name: Verify VPN and SSH permissions
        run: bash .github/scripts/deploy-wireguard.sh check frontend

      - name: Deploy frontend on server through VPN
        env:
          DEPLOY_TAG: ${{ needs.publish_image.outputs.version_tag }}
        run: bash .github/scripts/deploy-wireguard.sh deploy frontend

      - name: Close deployment VPN
        if: always()
        run: bash .github/scripts/deploy-wireguard.sh down frontend

  verify_deployment_connection:
    name: Verify VPN deployment access
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: frontend-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WireGuard tools
        run: |
          if ! command -v wg-quick >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wireguard-tools
          fi

      - name: Connect deployment VPN
        env:
          DEPLOY_WIREGUARD_CONFIG: ${{ secrets.DEPLOY_WIREGUARD_CONFIG }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: bash .github/scripts/deploy-wireguard.sh up frontend

      - name: Verify VPN and SSH permissions
        run: bash .github/scripts/deploy-wireguard.sh check frontend

      - name: Close deployment VPN
        if: always()
        run: bash .github/scripts/deploy-wireguard.sh down frontend
