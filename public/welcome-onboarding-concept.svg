<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="80" x2="1390" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F1E8"/>
      <stop offset="0.52" stop-color="#F4F7F1"/>
      <stop offset="1" stop-color="#E9F1F3"/>
    </linearGradient>
    <linearGradient id="hero" x1="1040" y1="96" x2="1398" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7D3BF"/>
      <stop offset="1" stop-color="#6EA58C"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E4A40"/>
      <stop offset="1" stop-color="#17382F"/>
    </linearGradient>
    <filter id="shadow" x="-60" y="-60" width="1720" height="1120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#233231" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-20" y="-20" width="300" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A352D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1388" cy="136" r="240" fill="#E6F0DF"/>
  <circle cx="188" cy="882" r="210" fill="#EAE3D4"/>
  <circle cx="1496" cy="836" r="130" fill="#DCEBE8"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="1472" height="884" rx="34" fill="#FCFBF8"/>
  </g>

  <rect x="96" y="92" width="1408" height="56" rx="18" fill="#F1F2EC"/>
  <circle cx="128" cy="120" r="8" fill="#E08B6A"/>
  <circle cx="154" cy="120" r="8" fill="#E9C46A"/>
  <circle cx="180" cy="120" r="8" fill="#7FB18A"/>
  <rect x="227" y="106" width="228" height="28" rx="14" fill="#FFFFFF"/>
  <text x="247" y="125" fill="#5F6F67" font-family="Georgia, serif" font-size="16">home automation / welcome</text>

  <text x="118" y="232" fill="#18211E" font-family="Georgia, serif" font-size="64" font-weight="700">Connect your home</text>
  <text x="118" y="279" fill="#45534D" font-family="Verdana, sans-serif" font-size="22">A calm first-run path for the real Home Assistant MVP.</text>
  <text x="118" y="312" fill="#67756E" font-family="Verdana, sans-serif" font-size="20">Install the agent, start it once, let entities flow in, then create the first controller.</text>

  <g filter="url(#soft)">
    <rect x="118" y="360" width="196" height="56" rx="18" fill="url(#pill)"/>
  </g>
  <text x="153" y="395" fill="#F6F3EC" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Install agent</text>

  <rect x="334" y="360" width="238" height="56" rx="18" fill="#E8EEE8"/>
  <text x="370" y="395" fill="#254E43" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Start with demo entities</text>

  <rect x="116" y="458" width="756" height="404" rx="28" fill="#F5F1E8"/>
  <text x="146" y="508" fill="#25312D" font-family="Verdana, sans-serif" font-size="21" font-weight="700">1. Install and run the agent</text>
  <text x="146" y="541" fill="#66746C" font-family="Verdana, sans-serif" font-size="18">Use the repo link and one copyable command. The page keeps checking for a live agent.</text>

  <rect x="146" y="574" width="340" height="116" rx="18" fill="#FFFDFC" stroke="#E4DED1"/>
  <text x="172" y="611" fill="#25312D" font-family="Verdana, sans-serif" font-size="18" font-weight="700">GitHub</text>
  <text x="172" y="645" fill="#5C6C65" font-family="monospace" font-size="17">github.com/.../agent</text>
  <text x="172" y="675" fill="#7A877F" font-family="Verdana, sans-serif" font-size="16">Open repo, copy token setup, then run.</text>

  <rect x="506" y="574" width="336" height="116" rx="18" fill="#152A24"/>
  <text x="532" y="611" fill="#CDE0D7" font-family="Verdana, sans-serif" font-size="17" font-weight="700">Run command</text>
  <text x="532" y="646" fill="#FFFFFF" font-family="monospace" font-size="16">uv run python main.py --base-url ...</text>
  <text x="532" y="672" fill="#A7C2B7" font-family="monospace" font-size="16">--ha-url ... --ha-token ...</text>

  <rect x="146" y="720" width="696" height="110" rx="20" fill="#FFFDFC" stroke="#E4DED1"/>
  <circle cx="183" cy="775" r="10" fill="#70A687"/>
  <text x="207" y="764" fill="#25312D" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Agent status</text>
  <text x="207" y="796" fill="#5C6C65" font-family="Verdana, sans-serif" font-size="18">Connected as <tspan font-weight="700">home1</tspan>, last seen a few seconds ago.</text>

  <rect x="906" y="196" width="550" height="664" rx="32" fill="#F2F7F5"/>
  <rect x="940" y="228" width="482" height="176" rx="24" fill="url(#hero)"/>
  <text x="970" y="286" fill="#17352D" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Live onboarding status</text>
  <text x="970" y="340" fill="#17352D" font-family="Georgia, serif" font-size="38" font-weight="700">3 of 4 steps complete</text>
  <text x="970" y="377" fill="#23493F" font-family="Verdana, sans-serif" font-size="18">Entities were imported. The next step is creating the first controller.</text>

  <rect x="940" y="438" width="482" height="92" rx="22" fill="#FFFFFF"/>
  <circle cx="976" cy="484" r="15" fill="#1F5D4D"/>
  <path d="M968 484L974 490L985 478" stroke="#F7F2EA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1008" y="476" fill="#1E2A26" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Agent connected</text>
  <text x="1008" y="504" fill="#607069" font-family="Verdana, sans-serif" font-size="17">The backend sees a live bridge to Home Assistant.</text>

  <rect x="940" y="548" width="482" height="92" rx="22" fill="#FFFFFF"/>
  <circle cx="976" cy="594" r="15" fill="#1F5D4D"/>
  <path d="M968 594L974 600L985 588" stroke="#F7F2EA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1008" y="586" fill="#1E2A26" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Entities discovered</text>
  <text x="1008" y="614" fill="#607069" font-family="Verdana, sans-serif" font-size="17">218 entities imported from the home and ready for selection.</text>

  <rect x="940" y="658" width="482" height="92" rx="22" fill="#FFFFFF"/>
  <circle cx="976" cy="704" r="15" fill="#D7A84F"/>
  <rect x="970" y="697" width="12" height="12" rx="3" fill="#FFF7E7"/>
  <text x="1008" y="696" fill="#1E2A26" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Review first controller</text>
  <text x="1008" y="724" fill="#607069" font-family="Verdana, sans-serif" font-size="17">We can propose relevant entities, then let the user confirm.</text>

  <g filter="url(#soft)">
    <rect x="940" y="780" width="220" height="58" rx="18" fill="#173C33"/>
  </g>
  <text x="983" y="816" fill="#FBF8F0" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Create first controller</text>

  <rect x="1188" y="780" width="234" height="58" rx="18" fill="#DEE9E3"/>
  <text x="1246" y="816" fill="#23493F" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Open dashboard</text>

  <rect x="118" y="878" width="1308" height="28" rx="14" fill="#EEF0E9"/>
  <rect x="118" y="878" width="981" height="28" rx="14" fill="#7FAE94"/>
  <text x="120" y="938" fill="#6A776F" font-family="Verdana, sans-serif" font-size="16">Welcome page concept: install path, live agent check, entity import progress, and a dev-only demo shortcut.</text>
</svg>
